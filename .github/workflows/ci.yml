name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        working-directory: apps/api
        run: uvx ruff@0.8.6 check app tests
      - name: Test (unit, no network)
        working-directory: apps/api
        run: uv run --frozen pytest -q -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gmov-web lint
      - run: pnpm --filter gmov-web typecheck
      - run: pnpm --filter gmov-web build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter gmov-web exec playwright install chromium --with-deps
      - name: Start API stack (db, redis, api)
        run: docker compose up -d --build db redis api
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 5
          done
          curl -sf http://localhost:8000/health
      - name: Run Playwright E2E
        run: pnpm --filter gmov-web exec playwright test --reporter=list,html
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3100
          PLAYWRIGHT_BACKEND_URL: http://localhost:8000
      - name: Upload trace + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Stop API stack
        if: always()
        run: docker compose down -v
