[project]
name = "gmov-api"
version = "0.1.0"
description = "gmov streaming backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30,<0.35",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.16",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<0.28",
  "passlib[bcrypt]>=1.7.4",
  "pyjwt>=2.8,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<0.28",
]

[tool.uv]
package = false
