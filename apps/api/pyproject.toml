[project]
name = "gmov-api"
version = "0.1.0"
description = "gmov streaming backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.117",
  "python-multipart>=0.0.18,<0.0.20",
  "uvicorn[standard]>=0.30,<0.35",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.16",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "redis>=5.0,<6.0",
  "httpx>=0.27,<0.28",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<4.1",
  "email-validator>=2.0,<3.0",
  "pyjwt>=2.8,<3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "aiosqlite>=0.19,<0.21",
  "respx>=0.22,<0.23",
  "fakeredis>=2.23",
  "ruff>=0.8,<0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: calls the real upstream API (needs network)"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/alembic/versions/*.py" = ["E501"]

[tool.uv]
package = false
